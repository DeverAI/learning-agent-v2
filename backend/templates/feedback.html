{% extends "base.html" %}
{% block content %}
<div class="header"><h1>问题反馈</h1></div>

<div class="card" style="padding:14px;margin-bottom:12px">
  <div class="card-title">提交反馈</div>
  <p style="font-size:13px;color:var(--text2);margin-bottom:10px">
    发现题目错、页面坏、答案不对、功能缺，都可以写在这里。巡检会定期看。
  </p>
  <div class="row">
    <div class="form-group"><label>类型</label>
      <select id="fbKind"><option value="bug">出错了</option><option value="question">题目/答案有问题</option><option value="idea">建议</option><option value="other">其他</option></select>
    </div>
    <div class="form-group"><label>来源页（可选）</label>
      <input type="text" id="fbPage" placeholder="如 /questions 或 /lecture">
    </div>
  </div>
  <div class="form-group"><label>一句话标题</label>
    <input type="text" id="fbTitle" placeholder="如：第20题答案算错" maxlength="200">
  </div>
  <div class="form-group"><label>详细说明</label>
    <textarea id="fbContent" rows="4" placeholder="发生了什么？题号/时间/截图描述…" maxlength="5000"></textarea>
  </div>
  <div class="row">
    <div class="form-group"><label>联系方式（可选）</label>
      <input type="text" id="fbContact" placeholder="可留微信/QQ，方便回复">
    </div>
    <div class="form-group"><label>设备</label>
      <select id="fbClient"><option value="web">网页</option><option value="android">安卓</option><option value="desktop">桌面</option></select>
    </div>
  </div>
  <button class="btn btn-primary" id="fbSubmitBtn">提交</button>
  <span id="fbStatus" style="font-size:12px;color:var(--text3);margin-left:8px"></span>
</div>

<div class="card" style="padding:14px">
  <div class="card-title">最近反馈</div>
  <div id="fbList"><span class="spin"></span></div>
</div>

<script>
(function(){
  function $(id){return document.getElementById(id)}
  function load(){
    $('fbList').innerHTML='<span class="spin"></span>';
    window.$API.get('/api/feedback?limit=30').then(function(r){
      var items=(r&&r.items)||[];
      if(!items.length){$('fbList').innerHTML='<div class="empty">还没有反馈</div>';return}
      var html='';
      items.forEach(function(f){
        var st={open:'待处理',doing:'处理中',done:'已解决',rejected:'不采纳'}[f.status]||f.status;
        html+='<div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">'+
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<b style="font-size:13px">'+$esc(f.title)+'</b>'+
          '<span class="tag">'+$esc(st)+'</span>'+
          '<span class="tag">'+$esc(f.kind)+'</span>'+
          '<span class="tag">'+$esc(f.client)+'</span>'+
          '<span style="font-size:11px;color:var(--text3)">'+$esc(f.created_at)+'</span>'+
          '</div>'+
          '<div style="font-size:13px;color:var(--text2);margin-top:4px;white-space:pre-wrap">'+$esc(f.content)+'</div>'+
          '</div>';
      });
      $('fbList').innerHTML=html;
    }).catch(function(e){
      $('fbList').innerHTML='<div class="empty">加载失败：'+$errText(e)+'</div>';
    });
  }
  $('fbSubmitBtn').addEventListener('click',function(){
    var content=$('fbContent').value.trim();
    if(!content){$('fbStatus').textContent='请填写说明';$('fbStatus').style.color='var(--err)';return}
    var btn=this;$busy(btn,true,'提交中...');
    window.$API.post('/api/feedback',{
      kind:$('fbKind').value,
      page:$('fbPage').value.trim(),
      title:$('fbTitle').value.trim(),
      content:content,
      contact:$('fbContact').value.trim(),
      client:$('fbClient').value
    }).then(function(r){
      $toast(r.message||'已提交','ok');
      $('fbContent').value='';$('fbTitle').value='';
      $('fbStatus').textContent='';$('fbStatus').style.color='var(--text3)';
      load();
    }).catch(function(e){
      $('fbStatus').textContent=$errText(e);$('fbStatus').style.color='var(--err)';
    }).finally(function(){$busy(btn,false)});
  });
  document.addEventListener('DOMContentLoaded',function(){
    load();
    // 自动带当前页
    try{
      var p=location.pathname;
      if(p && p!=='/feedback') $('fbPage').value=p;
    }catch(e){}
  });
})();
</script>
{% endblock %}
