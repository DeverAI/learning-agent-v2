{% extends "base.html" %}
{% block content %}
<div class="header">
  <h1>专注模式</h1>
  <p class="text-muted">AI 私人老师，分段讲解，实时调整</p>
</div>

<!-- 开始界面：选择学习模式 -->
<div id="focusStartScreen" class="card">
  <h3>开始专注学习</h3>
  <div class="form-row">
    <label>学习模式</label>
    <select id="focusMode" class="input">
      <option value="topic">主题学习</option>
      <option value="question">基于题目</option>
      <option value="mixed">混合模式</option>
    </select>
  </div>
  <div id="topicInputRow" class="form-row">
    <label>学习主题</label>
    <input id="focusTopic" type="text" class="input" placeholder="例如：二次函数最值、牛顿第二定律..." maxlength="200">
  </div>
  <div id="questionInputRow" class="form-row" style="display:none">
    <label>题目 ID</label>
    <input id="focusQuestionId" type="text" class="input" placeholder="输入题目 ID（可选）" maxlength="64">
  </div>
  <div class="form-row">
    <button id="btnStartFocus" class="btn btn-primary" onclick="FocusApp.start()">开始学习</button>
  </div>
  <div id="startError" class="text-err" style="display:none"></div>
</div>

<!-- 学习界面 -->
<div id="focusStudyScreen" style="display:none">
  <!-- 顶部状态栏 -->
  <div class="card focus-status-bar">
    <div class="focus-status-left">
      <span id="focusStatusBadge" class="badge">学习中</span>
      <span id="focusTopicDisplay" class="text-muted"></span>
    </div>
    <div class="focus-status-right">
      <span id="focusProgress" class="text-muted"></span>
      <button class="btn btn-sm" onclick="FocusApp.togglePause()">暂停</button>
      <button class="btn btn-sm btn-danger" onclick="FocusApp.end()">结束</button>
    </div>
  </div>

  {% if enable_blackboard %}
  <!-- 黑板板书区（AI 板书 + 回看快照；移动端大幅占屏） -->
  <div id="boardPanel" class="board-wrap" style="display:none">
    <div class="board-toolbar">
      <button class="btn btn-sm" id="boardPrev" onclick="FocusApp.boardPageShift(-1)" aria-label="上一页">‹</button>
      <span id="boardPageIndicator" class="board-page-indicator">1/1</span>
      <button class="btn btn-sm" id="boardNext" onclick="FocusApp.boardPageShift(1)" aria-label="下一页">›</button>
      <span class="board-toolbar-title">黑板</span>
      <button class="btn btn-sm" id="boardSnapshotsBtn" onclick="FocusApp.toggleBoardSnapshots()">快照</button>
      <button class="btn btn-sm btn-primary" id="boardSaveBtn" onclick="FocusApp.saveBoardSnapshot()">保存本页快照</button>
    </div>
    <div class="board-surface" id="boardSurface"></div>
    <div class="board-snapshots" id="boardSnapshots" style="display:none"></div>
  </div>
  {% endif %}

  <!-- 讲解内容区 -->
  <div id="focusContent" class="card focus-content">
    <div class="focus-loading">正在生成讲解...</div>
  </div>

  <!-- 检查点交互区 -->
  <div id="focusCheckpoint" class="card focus-checkpoint" style="display:none">
    <h4>检查点</h4>
    <p class="text-muted">请回答或确认你理解了吗</p>

    <!-- 语音输入 -->
    <div class="focus-voice-area">
      <button id="btnVoice" class="btn btn-primary" onclick="FocusApp.toggleVoice()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        点击说话
      </button>
      <span id="voiceStatus" class="text-muted"></span>
    </div>

    <!-- 文字输入（降级） -->
    <div id="textFallback" style="display:none">
      <textarea id="voiceTextInput" class="input" rows="2" placeholder="或在此输入文字..."></textarea>
    </div>

    <!-- 语音转文字预览 -->
    <div id="voiceTextPreview" class="focus-voice-preview" style="display:none"></div>

    <!-- 表情采集状态 -->
    <div id="emotionCapture" class="focus-emotion-capture" style="display:none">
      <div class="focus-camera-preview">
        <video id="focusVideo" autoplay playsinline muted></video>
        <canvas id="focusCanvas" style="display:none"></canvas>
      </div>
      <p class="text-muted">正在采集状态...</p>
    </div>

    <!-- 提交按钮 -->
    <div class="focus-checkpoint-actions">
      <button id="btnSubmitCheckpoint" class="btn btn-primary" onclick="FocusApp.submitCheckpoint()" disabled>提交</button>
    </div>
  </div>

  <!-- 暂停遮罩 -->
  <div id="focusPauseOverlay" class="focus-overlay" style="display:none">
    <div class="focus-overlay-content">
      <h3>已暂停</h3>
      <p class="text-muted">准备好了就继续吧</p>
      <button class="btn btn-primary" onclick="FocusApp.resume()">继续学习</button>
      <button class="btn btn-danger" onclick="FocusApp.end()">结束学习</button>
    </div>
  </div>
</div>

<!-- 结束界面 -->
<div id="focusEndScreen" class="card" style="display:none">
  <h3>学习完成</h3>
  <div id="focusSummary"></div>
  <div class="form-row" style="margin-top:16px">
    <button class="btn btn-primary" onclick="FocusApp.reset()">新的学习</button>
    <a href="/" class="btn">返回首页</a>
  </div>
</div>

<!-- 浏览器不支持提示 -->
<div id="focusUnsupported" class="card" style="display:none">
  <p class="text-warn">你的浏览器不支持部分专注模式功能（语音识别/合成）。你仍可以使用文字模式学习。</p>
</div>

<script defer src="/static/js/focus.js"></script>
{% endblock %}
