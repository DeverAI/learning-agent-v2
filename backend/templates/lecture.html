{% extends "base.html" %}
{% block content %}
<div style="max-width:760px;margin:0 auto;padding:14px">
  <h2 style="margin:4px 0 10px">AI 教师讲题</h2>
  <div class="card" style="padding:10px;margin-bottom:10px">
    <label style="font-weight:600">试卷</label>
    <select id="paperSelect" style="width:100%;padding:8px;margin:6px 0">
      <option value="">加载中...</option>
    </select>
    <label style="font-weight:600">或直接选题目</label>
    <select id="questionSelect" style="width:100%;padding:8px;margin:6px 0">
      <option value="">加载中...</option>
    </select>
    <button id="btnPlan" class="btn btn-primary" style="width:100%;padding:10px;margin-top:6px"
            onclick="LectureApp.start()">生成讲解并开始</button>
  </div>
  <div class="card" style="padding:10px">
    <div style="font-weight:600;margin-bottom:6px">讲解步骤
      <span id="lecPos" style="color:#888;font-weight:400"></span></div>
    <ol id="stepList" style="padding-left:20px;line-height:1.9"></ol>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button id="btnPrev" class="btn" onclick="LectureApp.prev()">上一步</button>
      <button id="btnSpeak" class="btn btn-primary" onclick="LectureApp.speakCurrent()">朗读本步</button>
      <button id="btnNext" class="btn" onclick="LectureApp.next()">下一步</button>
      <button id="btnStop" class="btn" onclick="LectureApp.stop()">停止</button>
      <label style="display:flex;align-items:center;gap:4px;margin-left:auto">
        <input type="checkbox" id="autoSpeak" checked> 自动朗读
      </label>
    </div>
  </div>
  <div id="lecStatus" style="color:#888;padding:8px 2px">就绪</div>
</div>
<script src="/static/js/lecture.js" defer></script>
{% endblock %}
