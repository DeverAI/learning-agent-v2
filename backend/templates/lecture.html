{% extends "base.html" %}
{% block content %}
<div style="max-width:760px;margin:0 auto;padding:14px">
  <h2 style="margin:4px 0 10px">AI 教师讲题</h2>
  <div class="card" style="padding:10px;margin-bottom:10px">
    <label style="font-weight:600">试卷</label>
    <select id="paperSelect" style="width:100%;padding:8px;margin:6px 0">
      <option value="">加载中...</option>
    </select>
    <label style="font-weight:600">或直接选题目</label>
    <select id="questionSelect" style="width:100%;padding:8px;margin:6px 0">
      <option value="">加载中...</option>
    </select>
    <button id="btnPlan" class="btn btn-primary" style="width:100%;padding:10px;margin-top:6px"
            onclick="LectureApp.start()">生成讲解并开始</button>
  </div>
  <div class="card" style="padding:10px">
    <div style="font-weight:600;margin-bottom:6px">讲解步骤
      <span id="lecPos" style="color:var(--text3);font-weight:400"></span></div>
    <ol id="stepList" style="padding-left:20px;line-height:1.9"></ol>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button id="btnPrev" class="btn" onclick="LectureApp.prev()">上一步</button>
      <button id="btnSpeak" class="btn btn-primary" onclick="LectureApp.speakCurrent()">朗读本步</button>
      <button id="btnNext" class="btn" onclick="LectureApp.next()">下一步</button>
      <button id="btnStop" class="btn" onclick="LectureApp.stop()">停止</button>
      <label style="display:flex;align-items:center;gap:4px;margin-left:auto">
        <input type="checkbox" id="autoSpeak" checked> 自动朗读
      </label>
    </div>
  </div>
  <!-- R31：讲课黑板（手机主视图）——与专注模式共用 .board-* 样式 -->
  <div class="board-wrap" id="lecBoardWrap" style="margin-top:10px">
    <div class="board-toolbar">
      <span class="board-toolbar-title">讲课黑板</span>
      <span id="lecBoardPos" class="board-page-indicator"></span>
    </div>
    <div class="board-surface" id="lecBoard">
      <div class="board-empty">开始讲解后，当前步骤会写在这里（手机上优先看这块板）</div>
    </div>
  </div>
  <div id="lecStatus" style="color:var(--text3);padding:8px 2px">就绪</div>
  <div class="card" style="padding:10px;margin-top:10px">
    <div style="font-weight:600;margin-bottom:6px">边看边问
      <span style="font-size:12px;color:var(--text3);font-weight:400">（不打断朗读；问题会带上当前这一步的讲解内容作为上下文）</span>
    </div>
    <div style="display:flex;gap:6px">
      <input type="text" id="lecAskInput" placeholder="对当前这一步有疑问？例如：这一步为什么这样变形？"
             style="flex:1;padding:8px"
             onkeydown="if(event.key==='Enter')LectureApp.ask()">
      <button class="btn btn-primary" id="btnAsk" onclick="LectureApp.ask()">问</button>
    </div>
    <div id="lecAskArea" style="margin-top:8px;font-size:13px;max-height:320px;overflow:auto"></div>
  </div>
</div>
<script src="/static/js/lecture.js" defer></script>
{% endblock %}
